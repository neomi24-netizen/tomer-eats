    h('h3',{style:'margin-top:14px'},'מה לא עושים'),

    h('p',{class:'hint'},'זה סיכום כללי ולא תחליף להדרכה. מומלץ מאוד לעבור קורס עזרה ראשונה והחייאה לתינוקות, למשל במד"א, ולבדוק שם את ההנחיות העדכניות.'),
    h('button',{class:'btn ghost',onclick:close},'סגור'))})}
const chokeBtn=()=>h('button',{class:'btn danger small',style:'margin-top:8px',onclick:chokeSheet},'מה עושים בחנק?');

/* ---------- log a whole meal ---------- */
function mealSheet(){sheet((sh,close)=>{
  const sel=new Map();let form=FORMS[0],meal='';
  const q=h('input',{type:'search',id:'ml-q',placeholder:'חפשו מאכל להוספה'});
  const box=h('div',{class:'stack',style:'margin-top:8px;max-height:210px;overflow:auto'});
  const chosen=h('div',{class:'stack',style:'margin-top:10px'});const warn=h('div',{style:'margin-top:8px'});
  const fb=h('div',{class:'chips'}),mb=h('div',{class:'chips'});
  const dt=h('input',{type:'date',id:'ml-date',value:iso()});const nt=h('textarea',{id:'ml-note',placeholder:'הערה לארוחה (לא חובה)'});
  const drawBox=()=>{box.innerHTML='';const t=q.value.trim();
    allFoods().filter(f=>!sel.has(f.id)&&(!t||f.name.includes(t))).slice(0,t?40:12).forEach(f=>box.append(h('button',{class:'food',onclick:()=>{sel.set(f.id,'love');drawAll()}},thumb(f),h('span',{class:'grow name'},f.name),tried(f.id)?h('span',{class:'tag g'},'ניסה'):h('span',{class:'tag'},'חדש'))))};
  const drawChosen=()=>{chosen.innerHTML='';
    sel.forEach((r,id)=>{const f=food(id);const rb=h('div',{class:'chips'},Object.keys(REACT).map(k=>h('button',{class:'chip','aria-pressed':r===k,onclick:()=>{sel.set(id,k);drawChosen()}},REACT[k])));
      chosen.append(h('div',{class:'card stack',style:'padding:10px'},h('div',{class:'row'},thumb(f),h('b',{class:'grow'},f.name),h('button',{class:'x','aria-label':'הסר',onclick:()=>{sel.delete(id);drawAll()}},'×')),rb))});
    warn.innerHTML='';const ids=[...sel.keys()].map(food);
    const newA=new Set();ids.forEach(f=>f.al.forEach(c=>{if(!S.alg[c])newA.add(c)}));
    if(newA.size>1)warn.append(h('div',{class:'notice bad',style:'margin-bottom:8px'},'בארוחה יש יותר מאלרגן חדש אחד ('+algNames([...newA])+'). מומלץ להכניס אלרגן אחד בכל פעם.'));
    else if(newA.size===1)warn.append(h('div',{class:'notice',style:'margin-bottom:8px'},'אלרגן שעוד לא ניתן: '+algNames([...newA])+'. כדאי להמתין כמה ימים לפני האלרגן הבא.'));
    const ws=ids.filter(f=>f.warn);if(ws.length)warn.append(h('div',{class:'notice'},ws.map(f=>h('div',null,f.name+': '+f.warn)),chokeBtn()))};
  const drawF=()=>{fb.innerHTML='';FORMS.forEach(k=>fb.append(h('button',{class:'chip','aria-pressed':form===k,onclick:()=>{form=k;drawF()}},k)))};
  const drawM=()=>{mb.innerHTML='';MEALS.forEach(([k,l])=>mb.append(h('button',{class:'chip','aria-pressed':meal===k,onclick:()=>{meal=meal===k?'':k;drawM()}},l)))};
  const drawAll=()=>{drawBox();drawChosen()};
  q.addEventListener('input',drawBox);
  const today=planIds(new Date().getDay());
  sh.append(h('h2',{style:'margin-top:0'},'רישום ארוחה'),h('p',{class:'muted',style:'margin:0 0 8px'},'בוחרים את כל המאכלים שבארוחה, ומסמנים תגובה לכל אחד.'),
    today.length?h('button',{class:'btn soft small',onclick:()=>{today.forEach(id=>{if(!sel.has(id))sel.set(id,'love')});drawAll()}},'הוסף את התפריט של היום'):'',
    h('div',{style:'margin-top:8px'},q),box,chosen,warn,
    h('label',null,'באיזו צורה הוגש?'),fb,h('label',null,'איזו ארוחה? (לא חובה)'),mb,h('label',{for:'ml-date'},'תאריך'),dt,h('label',{for:'ml-note'},'הערה'),nt,
    h('div',{class:'row',style:'margin-top:16px'},h('button',{class:'btn',onclick:()=>{
      if(!sel.size){q.focus();return}
      const d=dt.value||iso();
      sel.forEach((r,id)=>{(S.logs[id]=S.logs[id]||[]).push({d,r,f:form,n:nt.value.trim(),m:meal});S.logs[id].sort((a,b)=>a.d<b.d?-1:1);bumpAlg(food(id),d)});
      save();close();render()}},'שמור ארוחה'),h('button',{class:'btn ghost',onclick:close},'ביטול')));drawF();drawM();drawAll()})}

</script>
</body>
